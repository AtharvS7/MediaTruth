# ═══════════════════════════════════════════════════════════════════════════════
# MediaTruth — docker-compose.yml
# ═══════════════════════════════════════════════════════════════════════════════
#
# ARCH-07 fix: Now includes both backend AND frontend services.
# Usage:
#   docker-compose up --build           # start both services
#   docker-compose up backend           # backend only
#   docker-compose logs -f backend      # stream backend logs
#
# Prerequisites:
#   - backend/.env must exist with real Supabase credentials
#   - frontend/.env.local must exist with NEXT_PUBLIC_* vars
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      # Persist model weights across container restarts
      - model_weights:/app/models/weights
      # Optional: mount source for hot-reload in development
      # - ./backend:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s   # wait for model loading

  # ── Next.js Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?Set the public Supabase URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Set the publishable key}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  model_weights:
    driver: local
