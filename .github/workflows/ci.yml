name: MediaTruth CI

on:
  push:
    branches: [main, develop, "upgrade/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: Python Tests & Lint ────────────────────────────────────────────
  backend:
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install locked dependencies
        run: |
          pip install uv==0.12.19
          uv sync --frozen --extra ml

      - name: Run pytest
        run: uv run --frozen --extra ml python -m pytest tests/ -v --tb=short
        env:
          # Use dummy values for CI — tests mock the DB
          SUPABASE_URL: https://dummy.supabase.co
          SUPABASE_SERVICE_KEY: dummy-service-key
          JWT_SECRET: ci-test-secret-do-not-use

      - name: Check undefined names and syntax
        run: uv run --frozen --extra ml ruff check .

      - name: Python dependency audit
        run: uv run --frozen --extra ml pip-audit --progress-spinner off

  # ── Frontend: TypeScript & Build ────────────────────────────────────────────
  frontend:
    name: Frontend (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: TypeScript check (no emit)
        run: npx tsc --noEmit

      - name: Next.js build
        run: npm run build
        env:
          # Dummy values so build doesn't crash on missing env validation
          NEXT_PUBLIC_SUPABASE_URL: https://dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
          NEXT_PUBLIC_API_URL: https://dummy-api.onrender.com
          NODE_ENV: production

  # ── Security: Check for Secrets in Code ─────────────────────────────────────
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for hardcoded secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
