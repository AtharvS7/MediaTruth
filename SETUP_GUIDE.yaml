# ============================================================
#  MediaTruth — Complete New PC Setup Guide
#  Follow every step in order. Do not skip anything.
#  Estimated total time: 25–40 minutes (depending on internet)
# ============================================================

# This guide assumes:
#   - Windows 10 or 11 (college PC)
#   - You have admin rights (needed for software installs)
#   - You have internet access
#   - You have already pushed the code to GitHub


# ════════════════════════════════════════════════════════════
# PHASE 0 — BEFORE YOU ARRIVE (do this on your current PC)
# ════════════════════════════════════════════════════════════

phase_0_before_college:
  step_0_1_verify_github_push:
    action: "Make sure all files are pushed to GitHub"
    commands:
      - "cd D:/MediaTruth"
      - "git status"
      # Should say 'nothing to commit, working tree clean'
      # If not:
      - "git add ."
      - 'git commit -m "initial: full MediaTruth project"'
      - "git push origin main"
    verify: "Open github.com/YOUR_USERNAME/mediatruth in browser — all folders should be visible"

  step_0_2_save_your_env_values:
    action: "Write down or save these values securely (you will need them on the college PC)"
    values_to_save:
      - "SUPABASE_URL — from Supabase dashboard → Settings → API"
      - "SUPABASE_SERVICE_KEY — the service_role key (secret)"
      - "NEXT_PUBLIC_SUPABASE_ANON_KEY — the anon public key"
      - "Your GitHub repo URL — e.g. https://github.com/yourname/mediatruth"
    tip: "Save these in your phone notes, email to yourself, or a USB drive"


# ════════════════════════════════════════════════════════════
# PHASE 1 — INSTALL REQUIRED SOFTWARE ON COLLEGE PC
# Do these in order. Each must finish before the next starts.
# ════════════════════════════════════════════════════════════

phase_1_install_software:

  step_1_1_check_existing_installs:
    action: "Open Command Prompt (press Win+R → type cmd → press Enter) and run each check"
    commands:
      - command: "git --version"
        expected: "git version 2.x.x  (any 2.x is fine)"
        if_missing: "Install Git — see step_1_2"

      - command: "python --version"
        expected: "Python 3.11.x  (must be 3.11 — not 3.12, not 3.9)"
        if_missing: "Install Python — see step_1_3"
        if_wrong_version: "Install 3.11 alongside existing — see step_1_3"

      - command: "node --version"
        expected: "v18.x.x or v20.x.x"
        if_missing: "Install Node.js — see step_1_4"

      - command: "npm --version"
        expected: "9.x.x or 10.x.x  (comes with Node — no separate install needed)"

  step_1_2_install_git:
    skip_if: "git --version already works"
    download_url: "https://git-scm.com/download/win"
    instructions:
      - "Click the top download link (64-bit Git for Windows Setup)"
      - "Run the installer"
      - "On every screen: leave ALL options as their defaults — just click Next"
      - "On the last screen click Finish"
      - "Close and reopen Command Prompt"
    verify:
      command: "git --version"
      expected: "git version 2.x.x"

  step_1_3_install_python_311:
    skip_if: "python --version shows 3.11.x"
    download_url: "https://www.python.org/downloads/release/python-31110/"
    direct_link: "https://www.python.org/ftp/python/3.11.10/python-3.11.10-amd64.exe"
    instructions:
      - "Download python-3.11.10-amd64.exe"
      - "Run the installer"
      - "CRITICAL: On the first screen, tick 'Add Python 3.11 to PATH' checkbox at the bottom"
      - "Click 'Install Now'"
      - "Wait for completion — click Close"
      - "Close and reopen Command Prompt"
    verify:
      command: "python --version"
      expected: "Python 3.11.10"
    troubleshoot:
      problem: "Still shows wrong version after install"
      fix: |
        Run: py -3.11 --version
        If that works, use 'py -3.11' instead of 'python' for all commands in this guide.

  step_1_4_install_nodejs:
    skip_if: "node --version shows v18.x or v20.x"
    download_url: "https://nodejs.org/en/download"
    instructions:
      - "Click the 'LTS' button (Long Term Support — more stable)"
      - "Download the Windows Installer (.msi)"
      - "Run the installer"
      - "Leave all options as defaults — click Next on every screen"
      - "On the 'Tools for Native Modules' screen — you can leave the checkbox UNticked"
      - "Click Install → Finish"
      - "Close and reopen Command Prompt"
    verify:
      - command: "node --version"
        expected: "v20.x.x"
      - command: "npm --version"
        expected: "10.x.x"


# ════════════════════════════════════════════════════════════
# PHASE 2 — CLONE THE PROJECT
# ════════════════════════════════════════════════════════════

phase_2_clone_project:

  step_2_1_choose_a_working_folder:
    action: "Decide where to put the project on the college PC"
    recommendation: "Use C:/Projects or D:/Projects if a D drive exists with more space"
    commands:
      - "mkdir C:\\Projects"
      - "cd C:\\Projects"
    note: "If D drive exists and has more space: mkdir D:\\Projects  then  cd D:\\Projects"

  step_2_2_clone_from_github:
    action: "Download your project code"
    command: "git clone https://github.com/YOUR_USERNAME/mediatruth.git"
    replace: "YOUR_USERNAME with your actual GitHub username"
    expected_output: |
      Cloning into 'mediatruth'...
      remote: Enumerating objects: ...
      Receiving objects: 100% ...
      done.
    then_enter_folder: "cd mediatruth"

  step_2_3_verify_project_structure:
    action: "Confirm all files are present"
    command: "dir"
    expected_to_see:
      - "backend"
      - "frontend"
      - "supabase"
      - "docker-compose.yml"
      - "README.md"
    if_missing: "Re-check your GitHub push from Phase 0"


# ════════════════════════════════════════════════════════════
# PHASE 3 — BACKEND SETUP
# ════════════════════════════════════════════════════════════

phase_3_backend_setup:

  step_3_1_enter_backend_folder:
    command: "cd backend"

  step_3_2_create_virtual_environment:
    action: "Create an isolated Python environment so packages don't conflict with system Python"
    command: "python -m venv venv"
    expected: "A new folder called 'venv' appears inside backend/"
    duration: "About 15 seconds"
    if_error_python_not_found:
      try_instead: "py -3.11 -m venv venv"

  step_3_3_activate_virtual_environment:
    action: "Switch into the virtual environment — must do this in EVERY new terminal session"
    command: "venv\\Scripts\\activate"
    expected: |
      Your terminal prompt changes to show:
      (venv) C:\Projects\mediatruth\backend>
    if_error_execution_policy:
      fix: |
        Run this command first:
          Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser
        Then re-run: venv\Scripts\activate
    critical_note: "If you see (venv) at the start of your prompt, you are inside the venv. Good."

  step_3_4_upgrade_pip:
    action: "Make sure pip itself is up to date before installing packages"
    command: "python -m pip install --upgrade pip"
    expected: "Successfully installed pip-XX.X"

  step_3_5_install_python_dependencies:
    action: "Install all backend Python packages"
    command: "pip install -r requirements.txt"
    duration: "5 to 15 minutes depending on internet speed — PyTorch alone is ~800MB"
    what_is_being_installed:
      - "FastAPI + Uvicorn — the web server"
      - "PyTorch + torchvision — deep learning framework"
      - "timm — EfficientNet model"
      - "OpenCV — image and video processing"
      - "Pillow — image I/O"
      - "supabase — database client"
      - "exifread — EXIF metadata parser"
      - "python-jose — JWT auth"
      - "aiofiles — async file I/O"
    if_torch_install_fails:
      reason: "PyTorch has platform-specific wheels — the default may fail on some setups"
      fix: |
        Run this instead of pip install -r requirements.txt:
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
    if_any_package_fails:
      action: "Note the package name and skip it for now — install the rest, then fix individually"
      command_to_skip: "pip install -r requirements.txt --ignore-requires-python"

  step_3_6_create_env_file:
    action: "Create the backend environment configuration file"
    instructions:
      - "In your terminal, run: copy .env.example .env"
      - "Then open the .env file in Notepad: notepad .env"
      - "Fill in these values:"
    env_values_to_fill:
      SUPABASE_URL: "https://YOUR-PROJECT-ID.supabase.co"
      SUPABASE_SERVICE_KEY: "eyJhbGci... (your service_role key from Supabase dashboard)"
      JWT_SECRET: "any-random-string-you-make-up-e.g.-mediatruth-secret-2024"
      ALLOWED_ORIGINS: "http://localhost:3000"
      ENV: "development"
      PORT: "8000"
    save_and_close: "Ctrl+S then close Notepad"

  step_3_7_create_model_weights_directory:
    action: "Create the folder where ML model weights will be downloaded to"
    command: "mkdir models\\weights"
    note: "Models are downloaded automatically on first server start — this just creates the folder"

  step_3_8_verify_backend_starts:
    action: "Start the backend server and confirm it runs without errors"
    command: "uvicorn main:app --reload --port 8000"
    expected_output: |
      INFO:     Will watch for changes in these directories: [...]
      INFO:     Uvicorn running on http://0.0.0.0:8000 (Press CTRL+C to quit)
      INFO:     ModelLoader initialised on device: cpu
      INFO: Loading EfficientNet-B5 deepfake classifier...
      INFO: Loading CNNDetect GAN detector...
      INFO: All models loaded successfully.
    duration: "First start takes 1-3 minutes while models load from timm/torchvision"
    verify_in_browser:
      url: "http://localhost:8000"
      expected: '{"service":"MediaTruth API","version":"1.0.0","status":"operational"}'
    verify_health:
      url: "http://localhost:8000/health/"
      expected: '{"status":"healthy","models_loaded":true}'
    if_models_loaded_false:
      meaning: "Models still loading — wait 30 more seconds and refresh"
    stop_server: "Press Ctrl+C to stop when done verifying"
    keep_terminal_open: "Leave this terminal window open — you will need it running"


# ════════════════════════════════════════════════════════════
# PHASE 4 — FRONTEND SETUP
# ════════════════════════════════════════════════════════════

phase_4_frontend_setup:

  step_4_1_open_a_new_terminal:
    action: "Open a SECOND Command Prompt window — do not close the backend one"
    how: "Press Win+R → type cmd → Enter"
    then: "Navigate to the frontend folder"
    commands:
      - "cd C:\\Projects\\mediatruth\\frontend"

  step_4_2_create_env_file:
    action: "Create the frontend environment configuration file"
    commands:
      - "copy .env.local.example .env.local"
      - "notepad .env.local"
    env_values_to_fill:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
      NEXT_PUBLIC_SUPABASE_URL: "https://YOUR-PROJECT-ID.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGci... (your anon/public key — NOT service_role)"
    save_and_close: "Ctrl+S then close Notepad"
    critical: "NEXT_PUBLIC_SUPABASE_ANON_KEY must be the ANON key, not the service_role key"

  step_4_3_install_node_dependencies:
    action: "Install all frontend JavaScript packages"
    command: "npm install"
    duration: "2 to 5 minutes"
    expected_output: |
      added 847 packages, and audited 848 packages in 3m
      found 0 vulnerabilities
    if_vulnerabilities_found:
      action: "Note them but proceed — they are usually dev dependencies and won't block startup"
    if_npm_install_fails:
      try: "npm install --legacy-peer-deps"

  step_4_4_start_frontend_dev_server:
    action: "Start the Next.js development server"
    command: "npm run dev"
    expected_output: |
       ▲ Next.js 14.2.3
       - Local: http://localhost:3000
       ✓ Ready in 2.4s
    verify_in_browser:
      url: "http://localhost:3000"
      expected: "The MediaTruth landing page loads with the cyberpunk dark design"


# ════════════════════════════════════════════════════════════
# PHASE 5 — SUPABASE DATABASE SETUP
# (Only needed once — skip if you already ran schema.sql)
# ════════════════════════════════════════════════════════════

phase_5_supabase_setup:

  step_5_1_open_supabase_sql_editor:
    action: "Run the database schema in Supabase"
    instructions:
      - "Go to https://supabase.com/dashboard"
      - "Click on your project"
      - "In the left sidebar click 'SQL Editor'"
      - "Click '+ New query'"

  step_5_2_paste_and_run_schema:
    action: "Copy the schema SQL and run it"
    how_to_get_schema: |
      Open the file: mediatruth/supabase/schema.sql
      Select all content (Ctrl+A)
      Copy (Ctrl+C)
    paste_into: "The SQL Editor text area in Supabase dashboard"
    run: "Click the 'Run' button (or press Ctrl+Enter)"
    expected: "Success. No rows returned."
    if_error: "Run only the CREATE TABLE sections one at a time — some objects may already exist"

  step_5_3_verify_tables_created:
    action: "Confirm all tables exist"
    instructions:
      - "In Supabase left sidebar click 'Table Editor'"
      - "You should see three tables: users, scans, analysis_results"
    if_missing: "Re-run the schema SQL — make sure you included the full file content"


# ════════════════════════════════════════════════════════════
# PHASE 6 — VERIFY EVERYTHING WORKS END TO END
# ════════════════════════════════════════════════════════════

phase_6_end_to_end_verification:

  prerequisite: "Backend running in Terminal 1, Frontend running in Terminal 2"

  step_6_1_check_backend_api_docs:
    url: "http://localhost:8000/docs"
    expected: "Swagger UI loads showing all 4 API endpoints"

  step_6_2_test_image_upload:
    instructions:
      - "Go to http://localhost:3000/upload"
      - "Drag any .jpg or .png image onto the upload box"
      - "Click 'Run Forensic Analysis'"
      - "Watch the step-through progress animation (7 steps)"
    expected: "After 10-30 seconds you are redirected to /results/SCAN-ID"
    expected_on_results_page:
      - "Probability matrix bars animate in"
      - "Radar chart shows 4 detector scores"
      - "Final verdict badge appears (e.g. Authentic / Original)"
      - "Detector cards show percentage gauges"

  step_6_3_check_scan_history:
    instructions:
      - "Go to http://localhost:3000/history"
    expected: "The scan you just ran appears in the list with verdict and timestamp"

  step_6_4_check_database:
    instructions:
      - "Go to Supabase dashboard → Table Editor → scans"
    expected: "One row exists with your scan data"


# ════════════════════════════════════════════════════════════
# PHASE 7 — EVERY TIME YOU COME BACK TO WORK
# (You only need Phase 1-5 once. Do Phase 7 every session.)
# ════════════════════════════════════════════════════════════

phase_7_daily_startup_routine:

  terminal_1_backend:
    commands:
      - "cd C:\\Projects\\mediatruth\\backend"
      - "venv\\Scripts\\activate"
      - "uvicorn main:app --reload --port 8000"
    verify: "http://localhost:8000/health/ returns models_loaded: true"

  terminal_2_frontend:
    commands:
      - "cd C:\\Projects\\mediatruth\\frontend"
      - "npm run dev"
    verify: "http://localhost:3000 loads"

  pull_latest_code_if_needed:
    command: "git pull origin main"
    run_from: "C:\\Projects\\mediatruth\\"
    when: "If you pushed changes from another PC and want them here"


# ════════════════════════════════════════════════════════════
# TROUBLESHOOTING REFERENCE
# ════════════════════════════════════════════════════════════

troubleshooting:

  problem_1:
    symptom: "venv\\Scripts\\activate gives 'cannot be loaded because running scripts is disabled'"
    fix:
      command: "Set-ExecutionPolicy -ExecutionPolicy RemoteSigned -Scope CurrentUser"
      then: "Run activate again"
      note: "This is a Windows PowerShell security setting — safe to change"

  problem_2:
    symptom: "pip install fails with 'Microsoft Visual C++ is required'"
    fix:
      - "Download from: https://aka.ms/vs/17/release/vc_redist.x64.exe"
      - "Install it, restart terminal, retry pip install"

  problem_3:
    symptom: "npm install fails with ENOENT or EPERM"
    fix:
      - "Right-click Command Prompt → 'Run as administrator'"
      - "Navigate back to frontend folder"
      - "Re-run npm install"

  problem_4:
    symptom: "Backend starts but http://localhost:8000 returns 'connection refused'"
    fix:
      - "Make sure uvicorn actually says 'Uvicorn running on http://0.0.0.0:8000'"
      - "Check Windows Firewall is not blocking port 8000"
      - "Try http://127.0.0.1:8000 instead of localhost"

  problem_5:
    symptom: "Frontend shows 'Network Error' when uploading an image"
    fix:
      - "Make sure backend is running (check Terminal 1)"
      - "Check frontend .env.local has NEXT_PUBLIC_API_URL=http://localhost:8000"
      - "Stop frontend (Ctrl+C), restart with npm run dev"

  problem_6:
    symptom: "Supabase connection fails — error in backend logs about SUPABASE_URL"
    fix:
      - "Open backend/.env in Notepad"
      - "Verify SUPABASE_URL starts with https:// and ends with .supabase.co"
      - "Verify SUPABASE_SERVICE_KEY is the service_role key (not anon)"
      - "Save .env and restart the backend"

  problem_7:
    symptom: "models_loaded is false even after waiting 3+ minutes"
    fix:
      - "Check terminal for red error lines"
      - "Most common cause: torch not installed correctly"
      - "Run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu"
      - "Restart backend"

  problem_8:
    symptom: "Port 8000 or 3000 already in use"
    fix:
      commands:
        - "netstat -ano | findstr :8000"
        - "taskkill /PID <PID_NUMBER_FROM_ABOVE> /F"
      or_change_port:
        backend: "Change PORT=8001 in backend/.env and use --port 8001 in uvicorn command"
        frontend: "npm run dev -- --port 3001"


# ════════════════════════════════════════════════════════════
# QUICK REFERENCE CARD
# Print or screenshot this — all commands you need daily
# ════════════════════════════════════════════════════════════

quick_reference:
  backend_start:
    - "cd C:\\Projects\\mediatruth\\backend"
    - "venv\\Scripts\\activate"
    - "uvicorn main:app --reload --port 8000"

  frontend_start:
    - "cd C:\\Projects\\mediatruth\\frontend"
    - "npm run dev"

  important_urls:
    app:          "http://localhost:3000"
    api:          "http://localhost:8000"
    api_docs:     "http://localhost:8000/docs"
    api_health:   "http://localhost:8000/health/"
    supabase:     "https://supabase.com/dashboard"

  stop_servers: "Ctrl+C in each terminal window"
