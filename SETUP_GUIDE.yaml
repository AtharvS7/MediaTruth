# ============================================================
#  MediaTruth — Simplified Setup Guide (College PC)
# ============================================================

Required_Software:
  - Git (Any 2.x version)
  - Python (Must be 3.11)
  - Node.js (v18 or v20, includes npm)

Steps_To_Run_On_New_Computer:
  Step_1_Clone_Project:
    - Open Command Prompt
    - Run: git clone https://github.com/YOUR_USERNAME/mediatruth.git
    - Run: cd mediatruth
  
  Step_2_Run_Backend:
    - Open Terminal 1
    - Run: cd backend
    - Run: python -m venv venv
    - Run: venv\Scripts\activate
    - Run: pip install -r requirements.txt
    - Create `.env` file and paste your Supabase keys (SUPABASE_URL and SUPABASE_SERVICE_KEY)
    - Run: uvicorn main:app --reload --port 8000
    - Wait until terminal says "All models loaded successfully"

  Step_3_Run_Frontend:
    - Open Terminal 2
    - Run: cd frontend
    - Run: npm install
    - Create `.env.local` file and paste your Anon Keys (NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY)
    - Run: npm run build
    - Run: npm start
    - Go to http://localhost:3000 in your browser.
