# API coordinator only. Inference runs on a separately provisioned worker.
# No third-party inference or automatic deployments are enabled.
services:
  - type: web
    name: mediatruth-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --require-hashes -r requirements-prod.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/
    autoDeploy: false
    branch: upgrade/forensics-audit-metadata-export
    envVars:
      - key: ENV
        value: production
      - key: USE_HF_API
        value: "false"
      - key: ALLOW_MODEL_DOWNLOADS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WORKERS
        value: "1"
      - key: JOB_BACKEND
        value: supabase
      - key: WORKER_SECRET
        sync: false
      - key: WORKER_URL
        sync: false
