# Optional metadata-only demonstration service; not a production inference host.
# Full local-model analysis requires an existing machine with sufficient memory.
# No third-party inference or automatic deployments are enabled.
services:
  - type: web
    name: mediatruth-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install --require-hashes -r requirements-prod.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health/
    autoDeploy: false
    branch: main
    envVars:
      - key: ENV
        value: production
      - key: USE_HF_API
        value: "false"
      - key: ALLOW_MODEL_DOWNLOADS
        value: "false"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: WORKERS
        value: "1"
