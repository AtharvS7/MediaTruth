[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "mediatruth-backend"
version = "1.0.0"
description = "MediaTruth AI Media Forensics Platform — FastAPI backend"
requires-python = ">=3.11"

# ── Pytest configuration ──────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths    = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--tb=short",           # Compact tracebacks
    "-v",                   # Verbose test names
    "--strict-markers",     # Fail on unknown marks
    "--no-header",          # Cleaner output
]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
    "integration: marks integration tests that require real DB",
]

# ── Coverage configuration (requires pytest-cov) ─────────────────────────────
[tool.coverage.run]
source = ["."]
omit   = [
    "tests/*",
    "venv/*",
    ".venv/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ── Ruff (linter + formatter) ─────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length    = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "S",   # bandit security
]
ignore = [
    "S101",  # assert statements in tests
    "S311",  # random (not for crypto)
    "E501",  # line too long (ruff format handles this)
]

[tool.ruff.per-file-ignores]
"tests/*" = ["S", "N"]  # no security / naming checks in tests

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version         = "3.11"
warn_return_any        = true
warn_unused_configs    = true
ignore_missing_imports = true
