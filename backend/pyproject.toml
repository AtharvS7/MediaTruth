[project]
name = "mediatruth-backend"
version = "1.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.141.1,<1", "uvicorn[standard]>=0.54.0,<1",
  "python-multipart>=0.0.32,<1", "python-dotenv>=1.1,<2",
  "aiofiles>=24,<26", "supabase>=2.31,<3", "httpx>=0.28,<1",
  "slowapi==0.1.9", "Pillow>=12.3,<13", "opencv-python-headless>=4.12,<6",
  "numpy>=2.2,<3", "exifread>=3.5,<4", "requests>=2.32.5,<3",
  "c2pa-python>=0.37.12,<1", "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
ml = ["torch>=2.6,<3", "torchvision>=0.21,<1", "timm>=1.0.30,<2",
      "transformers>=4.57,<6", "safetensors>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "ruff>=0.16,<1", "pip-audit>=2.10,<3"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["F821", "F822", "F823", "E9"]
